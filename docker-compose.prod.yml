services:
  whiteboard:
    build: .
    image: whiteboard:latest
    restart: unless-stopped
    expose:
      - 3001
    volumes:
      # Everything mutable lives here: SQLite db, board documents, thumbnails.
      - ./whiteboard-data:/data
    environment:
      LOG_LEVEL: warn
    networks:
      - nginxproxymanager_default

networks:
  nginxproxymanager_default:
    external: true